name: Publish English lesson

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate course library
        run: |
          python scripts/validate_lessons.py
          python tests/validate-lessons.test.py
      - name: Test interactive course flows
        run: |
          npm install --no-save --package-lock=false jsdom@26.1.0
          python scripts/generate_audio.py --list-texts > .audio-plan.json
          node tests/book-core.test.js
          node tests/course-flow.test.js
          node tests/delivery-flow.test.js
          node tests/voice-player.test.js
          node tests/growth.test.js
          node tests/growth-integration.test.js
      - name: Restore existing recordings
        uses: actions/cache@v5
        with:
          path: dist/assets/audio
          key: lesson-audio-v1-${{ hashFiles('scripts/generate_audio.py', 'requirements-audio.txt') }}-${{ hashFiles('dist/assets/lessons.json') }}
          restore-keys: lesson-audio-v1-${{ hashFiles('scripts/generate_audio.py', 'requirements-audio.txt') }}-
      - name: Install recording generator
        run: python -m pip install -r requirements-audio.txt
      - name: Generate and verify all fixed recordings
        run: python scripts/generate_audio.py
      - name: Check JavaScript
        run: |
          node --check dist/app.js
          node --check dist/voice-player.js
          node --check dist/assets/audio-catalog.js
          node --check dist/book-core.js
          node --check dist/growth.js
          node --check dist/book.js
          node --check dist/course-runtime.js
          node --check dist/course-engine.js
          node --check dist/delivery-engine.js
          node tests/book-core.test.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload lesson
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
